name: NEXUS X11 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Kaynak kodu ve alt modulleri al
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle onbellegi
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK ve yerel derleme araclari
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;25.1.8937393' \
            'cmake;3.22.1'

      - name: Proje yapisini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f lorie/src/main/cpp/CMakeLists.txt
          test -f lorie/src/main/java/com/termux/x11/MainActivity.java
          test -f lorie/src/main/res/layout/main_activity.xml
          grep -q 'nexus_windows_start' lorie/src/main/res/layout/main_activity.xml
          grep -q 'com.termux.RUN_COMMAND' lorie/src/main/java/com/termux/x11/MainActivity.java
          echo 'NEXUS X11 kaynak kontrolleri gecti.'

      - name: APK derle
        run: bash ./gradlew :lorie-app:assembleStandaloneDebug --stacktrace --no-daemon

      - name: APK dosyalarini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-x11-debug-apk
          path: lorie-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
